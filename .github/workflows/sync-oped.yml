name: Sync OP/ED Data

on:
  schedule:
    # Run every 30 minutes during initial deployment sweep (~27 runs total to complete all ~8,100 subjects in ~13.5 hours)
    # Change back to weekly '0 0 * * 0' after initial sweep completes.
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-oped
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run OP/ED Sync Script
        run: python scripts/sync_oped.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-sync OP/ED timestamps data"
          file_pattern: "*.txt *.json *"
